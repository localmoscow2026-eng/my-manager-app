<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>به‌روزرسانی مدیریت من</title>
<style>body{font-family:-apple-system,Tahoma,sans-serif;background:#1e3a5f;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;text-align:center;font-size:20px}</style></head>
<body><div id="m">در حال به‌روزرسانی… (اطلاعات شما حفظ می‌شود)</div>
<script>
(async()=>{try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();}
if(window.caches){const ks=await caches.keys();for(const k of ks)await caches.delete(k);}}catch(e){}
document.getElementById('m').textContent='انجام شد! در حال باز کردن نسخه جدید…';
setTimeout(()=>location.replace('./?v='+Date.now()),1200);})();
</script></body></html>
